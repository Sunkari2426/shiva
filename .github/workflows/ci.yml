name: Scrap Mama CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd server && npm install
      - run: npm --prefix server test
      - run: node --check server/src/server.js
      - run: node --check server/src/services/otp.js
      - run: node --check server/src/routes/auth.js
      - run: node --check server/src/routes/pickups.js
      - run: node --check server/src/routes/collector.js
      - run: node --check server/src/routes/admin.js
